name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - name: Install dependencies
        run: shards install
      - name: Specs (single-threaded)
        run: crystal spec
      - name: Specs (multithreaded)
        run: CRYSTAL_WORKERS=4 crystal spec -Dexecution_context

  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saci
          POSTGRES_PASSWORD: saci
          POSTGRES_DB: saci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saci"
          --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: saci
          MYSQL_PASSWORD: saci
          MYSQL_DATABASE: saci_test
          MYSQL_ROOT_PASSWORD: saci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psaci-root"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.22"
      - name: Install dependencies
        run: shards install
      - name: MySQL native-password auth (crystal-mysql requirement)
        run: |
          mysql -h 127.0.0.1 -uroot -psaci-root \
            -e "ALTER USER 'saci'@'%' IDENTIFIED WITH mysql_native_password BY 'saci';"
      - name: Live PG + MySQL specs
        run: |
          cc -c live/ossl_shim.c -o live/ossl_shim.o
          PG_URL="postgres://saci:saci@127.0.0.1:5432/saci_test" \
          MYSQL_URL="mysql://saci:saci@127.0.0.1:3306/saci_test" \
          crystal spec live/pg_live_spec.cr live/mysql_live_spec.cr \
            --link-flags="$PWD/live/ossl_shim.o"
